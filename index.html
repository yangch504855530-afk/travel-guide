<title>旅行攻略工具 · 游玩时长/人群适配/交通/行程</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
/* 伊斯坦布尔旅行攻略工具 — 样式（无外部资源） */
:root {
  --bg: #f6f1e7; --card: #ffffff; --ink: #2b2118; --muted: #7a6a58;
  --teal: #0f6b6b; --teal-dark: #0a4d4d; --terra: #c2571b; --gold: #b98a2f;
  --line: #e6dccb; --danger: #b3261e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--ink); line-height: 1.65; }

header.site {
  background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 60%, #12867f 100%);
  color: #fff; padding: 22px 18px 14px; }
header.site h1 { font-size: 22px; letter-spacing: 1px; }
header.site .sub { opacity: .85; font-size: 13px; margin-top: 4px; }
header.site .disclaimer { margin-top: 10px; font-size: 12px; background: rgba(255,255,255,.14);
  border-radius: 8px; padding: 6px 10px; display: inline-block; }
.citybar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.citybar-label { font-size: 12.5px; opacity: .85; }
#city-select { flex: 1 1 160px; min-width: 0; max-width: 320px; padding: 7px 10px; border-radius: 10px;
  border: none; font-size: 14px; background: #fff; color: var(--teal-dark); font-weight: 700; }
.citybar .mini { border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.14); color: #fff;
  font-size: 12.5px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.citybar .mini:hover { background: rgba(255,255,255,.28); }

#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
  max-width: 520px; width: calc(100% - 32px); background: #173c3c; color: #fff; font-size: 13.5px;
  border-radius: 12px; padding: 12px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
  opacity: 0; pointer-events: none; transition: all .3s; z-index: 999; line-height: 1.55; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: #7a1f18; max-height: 40vh; overflow-y: auto; }

nav.tabs { position: sticky; top: 0; z-index: 50; background: var(--teal-dark);
  display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; }
nav.tabs button { flex: 0 0 auto; border: none; cursor: pointer; font-size: 14px;
  padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; }
nav.tabs button.active { background: #fff; color: var(--teal-dark); font-weight: 700; }

main { max-width: 1080px; margin: 0 auto; padding: 18px 14px 60px; }
section.view { display: none; }
section.view.active { display: block; }

h2.vt { font-size: 20px; margin: 6px 0 4px; color: var(--teal-dark); }
p.vd { color: var(--muted); font-size: 13px; margin-bottom: 14px; }

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 720px) { .g2, .g3 { grid-template-columns: 1fr; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  box-shadow: 0 1px 3px rgba(43,33,24,.06); }
.card h3 { font-size: 15.5px; margin-bottom: 6px; }
.qf { text-align: center; }
.qf .icon { font-size: 22px; }
.qf .k { font-weight: 700; font-size: 13px; margin-top: 2px; }
.qf .v { font-size: 12px; color: var(--muted); }

/* 景点卡片 */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters input[type=search], .filters select, .planner-form select, .planner-form input {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
  font-size: 14px; color: var(--ink); }
.count { color: var(--muted); font-size: 13px; margin-left: auto; }
.attr-card { border-left: 5px solid var(--teal); }
.attr-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.badge { font-size: 12px; background: #eef5f4; color: var(--teal-dark); border-radius: 999px; padding: 2px 10px; }
.badge.price { background: #f8efe3; color: #8a5a12; }
.badge.time { background: #f0e9f8; color: #5a3d8a; }
.badge.warnclose { background: #fdeceb; color: var(--danger); }
.fit-row { display: flex; flex-wrap: wrap; gap: 5px; font-size: 12px; color: var(--muted); margin: 6px 0; }
.fit-row b { color: var(--ink); font-weight: 600; }
.attr-card .transport { font-size: 13px; color: var(--teal-dark); background: #eef5f4;
  border-radius: 8px; padding: 4px 8px; margin: 6px 0; }
.attr-card details { margin-top: 6px; font-size: 13px; }
.attr-card details summary { cursor: pointer; color: var(--terra); font-weight: 600; }
.attr-card ul { padding-left: 18px; }
.desc { font-size: 13px; color: var(--muted); }

/* 表单 */
.planner-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; }
.planner-form label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 3px; }
.planner-form .field { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 5px 12px; cursor: pointer; user-select: none; }
.chip.on { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700; }
.chip.on::after { content: ' ✓'; }
.btn { display: inline-block; border: none; cursor: pointer; font-size: 15px; font-weight: 700;
  background: var(--terra); color: #fff; border-radius: 12px; padding: 10px 22px; margin-top: 12px; }
.btn.secondary { background: var(--teal); }
.btn:active { transform: translateY(1px); }

/* 行程时间线 */
.day-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }
.day-head h3 { font-size: 17px; color: var(--teal-dark); }
.day-head .wd { font-size: 13px; color: var(--terra); font-weight: 700; }
.day-note { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; }
.tl { position: relative; padding-left: 18px; border-left: 3px solid #d8cdb8; margin-left: 8px; }
.tl-item { position: relative; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 14px; margin: 0 0 10px 8px; }
.tl-item::before { content: ''; position: absolute; left: -24px; top: 18px; width: 11px; height: 11px;
  border-radius: 50%; background: var(--terra); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--terra); }
.tl-item.lunch::before { background: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.tl-time { font-weight: 700; font-size: 13px; color: var(--terra); }
.tl-name { font-weight: 700; font-size: 15px; }
.tl-transit { font-size: 12.5px; color: var(--teal-dark); background: #eef5f4; border-radius: 8px;
  padding: 3px 8px; margin-bottom: 6px; display: inline-block; }
.tl-meta { font-size: 12.5px; color: var(--muted); }
.dinner { font-size: 13px; color: var(--ink); background: #fdf6ec; border: 1px dashed var(--gold);
  border-radius: 10px; padding: 8px 12px; margin-top: 4px; }

.warnbox { background: #fff8e6; border: 1px solid #eedc9a; border-radius: 12px; padding: 10px 14px;
  font-size: 13px; margin: 12px 0; }
.skipbox { font-size: 13px; }
.skipbox li { margin: 3px 0 3px 18px; }

/* 交通 / 贴士 */
.trans-card h3 { color: var(--teal-dark); }
.trans-card li, .tips-card li { font-size: 13.5px; margin: 5px 0 5px 18px; }
.tips-card details { border-top: 1px dashed var(--line); padding: 8px 0; }
.tips-card details:first-child { border-top: none; }
.tips-card summary { cursor: pointer; font-weight: 700; font-size: 15px; }
table.route { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
table.route th, table.route td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
table.route th { background: #eef5f4; color: var(--teal-dark); }
@media (max-width: 720px) { table.route { font-size: 12px; } }

/* 预算 */
.budget { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 10px 0; }
.budget .card { text-align: center; }
.budget .big { font-size: 17px; font-weight: 800; color: var(--teal-dark); }
.budget .lab { font-size: 12px; color: var(--muted); }
.relbox li { font-size: 13px; margin: 4px 0 4px 18px; }

footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

/* 打印：只保留行程 */
@media print {
  header.site, nav.tabs, .planner-form, .filters, footer, .no-print { display: none !important; }
  body { background: #fff; }
  section.view { display: none !important; }
  section.view#view-plan.active { display: block !important; }
  .card, .tl-item { box-shadow: none; }
  .btn { display: none !important; }
}

</style>
</head>

  <section class="view" id="view-transport"></section>
  <section class="view" id="view-tips"></section>

<script>
/* ===== js/planner.js ===== */
/* 通用旅行行程引擎（不绑定任何城市；数据由"城市包"提供）
 * 纯函数、确定性输出；浏览器挂 window.Planner，Node 走 module.exports。
 * Planner.setPack(pack) 设置当前城市包后调用 generatePlan / budgetSummary。
 */
(function (global) {
  'use strict';

  let activePack = null;
  function setPack(p) { activePack = p; }
  function pack() {
    if (!activePack) throw new Error('Planner.setPack(pack) 未调用');
    return activePack;
  }

  const DAY_CAP_MIN = { relaxed: 6 * 60, standard: 8 * 60, packed: 9.5 * 60 };
  const SLACK = 30;          // 容量弹性（分钟）
  const BUFFER = 15;         // 站点间缓冲
  const LUNCH_START = 13 * 60, LUNCH_MIN = 60, DAY_START = 9 * 60;
  const MAX_MOSQUES_PER_DAY = 2;

  const WEEKDAYS_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  const TRANSIT_FALLBACK = { m: 25, how: '🚕 打车', note: '跨区' };

  const pad2 = n => String(n).padStart(2, '0');
  function localDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function transitFor(a, b) {
    if (!a || !b || a === b) return null;
    const T = activePack ? activePack.TRANSIT : null;
    if (T) {
      const hit = T[a + '|' + b] || T[b + '|' + a];
      if (hit) return hit;
    }
    return TRANSIT_FALLBACK;
  }

  function formatMin(t) {
    t = ((t % 1440) + 1440) % 1440;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }

  function interestTag() { // 兴趣 -> tag 命中表（来自城市包 INTERESTS）
    const out = {};
    const ints = activePack ? activePack.INTERESTS : null;
    if (ints) Object.keys(ints).forEach(k => { out[k] = ints[k].tag; });
    return out;
  }

  function scoreAttraction(a, cfg, anchorDistrict, dayIndex) {
    const fit = (a.groupFit && a.groupFit[cfg.group]) || 3;
    let s = fit * 2 + (a.priority || 1) * 3; // 必看项(priority 3)要有入场券保障
    if (anchorDistrict) {
      if (a.district === anchorDistrict) s += 2.2;          // 同区强聚类
      else if (nearOf(anchorDistrict).includes(a.district)) s += 1.0; // 近邻区
      else s -= 0.8;                                        // 跨半个城，惩罚
    }
    if (dayIndex === 0 && cfg.hotel === a.district) s += 1.5;
    if (cfg.interests && cfg.interests.length) {
      const table = interestTag();
      cfg.interests.forEach(i => { if (a.tags && a.tags.includes(table[i])) s += 0.9; });
    }
    if (a.bestTime === 'evening') s += 0.5; // 晚上还能加的偏移，由排程决定去留
    if (a.fullDay) s += 0.3;
    return s;
  }

  // 与某分区换乘 ≤20 分钟的"近邻"分区
  function nearOf(district) {
    if (!activePack) return [];
    return Object.keys(activePack.DISTRICTS).filter(d => {
      if (d === district) return false;
      const t = transitFor(district, d);
      return t && t.m <= 20;
    });
  }

  function parseDate(str) { // 'YYYY-MM-DD' -> Date(本地) | null
    if (!str) return null;
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(date, n) {
    const d = new Date(date); d.setDate(d.getDate() + n); return d;
  }

  function closedOn(a, date) {
    return !!(date && a.closedDays && a.closedDays.includes(date.getDay()));
  }

  // 午餐建议：按当日中午所在分区从美食库轮转取（经济档过滤高价，正餐馆不当午餐）
  function buildLunch(startMin, district, dayIndex, excludeNames, tier) {
    const fb = activePack && activePack.districtLunchFallback
      && activePack.districtLunchFallback[district];
    if (fb) return { start: startMin, end: startMin + LUNCH_MIN,
      name: fb.name, where: fb.where, price: fb.price };
    const econMax = activePack ? activePack.MEAL_TIERS.economy.perDay[0] * 1.2 : 300;
    let foods = (activePack ? activePack.FOODS : [])
      .filter(f => !f.noLunch && (f.district === district || f.district === 'any')
        && !(excludeNames || []).includes(f.name));
    if (tier === 'economy') foods = foods.filter(f => f.price[0] <= econMax);
    const pick = foods.length ? foods[(dayIndex - 1) % foods.length] : null;
    if (pick && excludeNames) excludeNames.push(pick.name); // 午餐名字入占用集，当天晚餐不再重复
    const defPrice = econMax ? [Math.round(econMax * 0.5), Math.round(econMax * 0.9)] : [150, 350];
    return { start: startMin, end: startMin + LUNCH_MIN,
      name: pick ? pick.name : '当地午餐', where: pick ? pick.where : '就近餐馆', price: pick ? pick.price : defPrice };
  }

  // 晚餐：只推荐正餐（noDinner 除外），按餐饮档次过滤，且跨天不重样
  function buildDinner(district, dayIndex, usedNames, tier) {
    const econMax = activePack ? activePack.MEAL_TIERS.economy.perDay[0] * 1.2 : 300;
    let pool = (activePack ? activePack.FOODS : [])
      .filter(f => !f.noDinner && !usedNames.includes(f.name));
    if (tier === 'economy') pool = pool.filter(f => f.price[0] <= econMax);
    if (tier === 'premium') pool = pool.slice().sort((a, b) => b.price[0] - a.price[0]); // 高端档优先大餐
    const pick = pool.find(f => f.district === district)
      || pool.find(f => f.district === 'any')
      || pool[0];
    if (!pick) return null;
    usedNames.push(pick.name);
    return { name: pick.name, where: pick.where, price: pick.price };
  }

  // 夜间友好：夜场场馆/街区/体验/游船/晚间偏好项；集市 18-19 点关门，不算夜间友好
  const eveningFriendly = a => a.openLate
    || ['neighborhood', 'experience', 'waterfront'].includes(a.category)
    || a.bestTime === 'evening';

  /* ---------------- 生成行程 ---------------- */
  function generatePlan(cfg, attractions) {
    cfg = Object.assign({ days: 3, group: 'couple', pace: 'standard', startDate: null,
      interests: [], hotel: 'undecided', mealTier: 'comfort' }, cfg);
    const cap = DAY_CAP_MIN[cfg.pace] || DAY_CAP_MIN.standard;
    const startDate = parseDate(cfg.startDate);
    const warnings = [];
    const skipped = [];
    const chosen = new Set();
    const dinnerNamesUsed = [];

    const days = [];
    for (let d = 0; d < cfg.days; d++) {
      const date = startDate ? addDays(startDate, d) : null;
      const day = { index: d + 1, date, dateStr: date ? localDateStr(date) : null,
        weekday: date ? WEEKDAYS_CN[date.getDay()] : '第' + (d + 1) + '天',
        stops: [], lunch: null, dinner: null, notes: [], used: 0, anchor: null, costPerPerson: [0, 0] };
      days.push(day);
    }

    for (const day of days) {
      // 1) 当日锚点：可用候选中分数最高
      const avail = attractions
        .filter(a => !chosen.has(a.id) && !closedOn(a, day.date))
        .sort((x, y) => scoreAttraction(y, cfg, null, day.index - 1) - scoreAttraction(x, cfg, null, day.index - 1)
          || (x.id < y.id ? -1 : 1));
      if (!avail.length) break;
      const anchor = avail[0];
      chosen.add(anchor.id);
      day.anchor = anchor;
      day.used = anchor.duration * 60;
      day.stops.push({ attr: anchor, transit: null });

      const fullDay = !!anchor.fullDay;
      if (fullDay) day.used = Math.max(day.used, 6.5 * 60);

      // 2) 填充：同区优先、容量与清真寺上限约束
      let mosques = anchor.category === 'mosque' ? 1 : 0;
      let pool = attractions
        .filter(a => !chosen.has(a.id) && !closedOn(a, day.date))
        .sort((x, y) => scoreAttraction(y, cfg, anchor.district, day.index - 1)
          - scoreAttraction(x, cfg, anchor.district, day.index - 1)
          || (x.id < y.id ? -1 : 1));
      if (fullDay) pool = []; // 王子群岛等全天项目当日独占，不再叠加
      for (const a of pool) {
        if (a.fullDay) continue;
        const add = a.duration * 60 + BUFFER;
        if (day.used + add > cap + SLACK) continue;
        if (a.category === 'mosque' && mosques >= MAX_MOSQUES_PER_DAY) continue;
        if (a.category === 'mosque' && day.used > 6 * 60) continue; // 清真寺不排到傍晚（礼拜/关门）
        if (a.category === 'waterfront' && day.stops.some(x => x.attr.category === 'waterfront')) continue; // 一天不排两种船
        // 傍晚规则：预估开始时间 ≥18:00 时只排夜游友好项（含 1h 午餐+缓冲的粗估）
        if (!eveningFriendly(a) && DAY_START + day.used + 75 >= 18 * 60) continue;
        // 集市收摊早（约 18-19 点），预估 16:30 后不再排
        if (a.category === 'bazaar' && DAY_START + day.used + 75 >= 16.5 * 60) continue;
        day.stops.push({ attr: a, transit: null });
        chosen.add(a.id);
        day.used += add;
        if (a.category === 'mosque') mosques++;
      }
      const relLabel = (activePack && activePack.religiousLabel) || '宗教场所';
      if (mosques >= MAX_MOSQUES_PER_DAY) day.notes.push('当日已含 ' + mosques + ' 处' + relLabel + '，避免审美疲劳，不再叠加。');
      if (fullDay) day.notes.push(anchor.name + ' 为全天行程：请上午尽早出发，并留意返程交通的末班时间。');

      // 3) 时间线：按"最近邻"重排当日顺序避免两岸横跳，9:00 起，正午插入午餐
      const rest = day.stops.slice(1);
      const chain = [day.stops[0]];
      while (rest.length) {
        let bi = 0, bm = Infinity;
        for (let i = 0; i < rest.length; i++) {
          const tr = transitFor(chain[chain.length - 1].attr.district, rest[i].attr.district);
          const m = tr ? tr.m : 0; // 同区=步行级 0 分钟，不能落到跨区 fallback
          if (m < bm) { bm = m; bi = i; }
        }
        chain.push(rest.splice(bi, 1)[0]);
      }
      day.stops = chain;

      let t = (day.anchor && day.anchor.bestTime === 'evening' ? 10.5 * 60 : DAY_START), hadLunch = false;
      const timedStops = [];
      for (let i = 0; i < day.stops.length; i++) {
        const s = day.stops[i];
        const dur = s.attr.fullDay ? 6.5 * 60 : s.attr.duration * 60;
        const tr = i > 0 ? transitFor(timedStops[i - 1].attr.district, s.attr.district) : null;
        const trMin = tr ? tr.m : 0;
        const st = t + trMin;
        if (!hadLunch && day.stops.length > 1 && i >= 1 && st + dur > 13 * 60) {
          // 上一站结束已过正午就直接在原地吃（t），否则走到下一站附近吃（st）；最晚 ~13:30 开饭
          const lunchStart = Math.round(Math.max(t >= 12 * 60 ? t : st, 11 * 60) / 5) * 5;
          day.lunch = buildLunch(lunchStart, s.attr.district, day.index, dinnerNamesUsed, cfg.mealTier);
          t = lunchStart + LUNCH_MIN + trMin + 10; // 午餐后完成转场+10 分钟步行缓冲，杜绝时间重叠
          hadLunch = true;
        } else {
          t = st;
        }
        t = Math.round(t / 5) * 5; // 5 分钟取整，避免虚假精确
        timedStops.push({ start: t, end: t + dur, attr: s.attr, transit: tr });
        t += dur + BUFFER;
      }
      day.stops = timedStops;

      // 4.5) 兜底：仍排到 18:00 后的非夜游项移入未安排（正常已被填充规则拦截）
      const dropped = timedStops.filter(s => s.start >= 18 * 60 && !eveningFriendly(s.attr));
      for (const s of dropped) timedStops.splice(timedStops.indexOf(s), 1);
      dropped.forEach(s => skipped.push({ name: s.attr.name,
        reason: '第 ' + day.index + ' 天排到该点时已过 18:00（不适宜夜间参观），建议自行替换' }));

      // 4.4) 全天/长行程但未触发午餐插入的（如大岛独占日），补一条午餐建议；
      //      若落在某个景点时间段内（如全天项目），标记 inline 改为日注记渲染，不占时间线
      if (!day.lunch && day.used >= 300) {
        day.lunch = buildLunch(12.5 * 60, day.anchor.district, day.index, dinnerNamesUsed, cfg.mealTier);
        day.lunch.inline = timedStops.some(s => day.lunch.start >= s.start && day.lunch.end <= s.end);
      }

      // 4) 晚餐：当日末站分区轮转，正餐不重样
      const firstDistrict = Object.keys(activePack.DISTRICTS)[0];
      const lastDistrict = timedStops.length ? timedStops[timedStops.length - 1].attr.district : firstDistrict;
      day.dinner = buildDinner(lastDistrict, day.index, dinnerNamesUsed, cfg.mealTier);

      // 5) 出发提示
      if (cfg.hotel && cfg.hotel !== 'undecided' && day.anchor) {
        const tr = transitFor(cfg.hotel, day.anchor.district);
        if (tr) day.notes.push('从住宿区出发：' + tr.how + '，约 ' + tr.m + ' 分钟。');
      }
      day.costPerPerson = day.stops.reduce((acc, s) => {
        return [acc[0] + s.attr.price[0], acc[1] + s.attr.price[1]];
      }, [0, 0]);
    }

    // 6) 未安排清单与原因
    for (const a of attractions) {
      if (chosen.has(a.id)) continue;
      let reason = '行程天数内时间不足';
      if (startDate) {
        const allDaysClosed = days.every((day, i) => closedOn(a, addDays(startDate, i)));
        if (allDaysClosed && a.closedDays.length) reason = '行程日期内均为闭馆日（' +
          a.closedDays.map(x => WEEKDAYS_CN[x]).join('/') + ' 闭馆）';
      } else if (a.closedDays.length) {
        reason = '未选出发日期，闭馆日未纳入计算（' + a.closedDays.map(x => WEEKDAYS_CN[x]).join('/') + ' 闭馆）';
      }
      skipped.push({ name: a.name, reason });
    }

    // 7) 闭馆日规避提示
    if (startDate) {
      const avoided = attractions.filter(a => a.closedDays.length && days.some((day, i) =>
        closedOn(a, addDays(startDate, i)) && !days[i].stops.some(s => s.attr.id === a.id)
        && days.some(dd => dd.stops.some(s => s.attr.id === a.id))));
      if (avoided.length) warnings.push('已自动避开闭馆日：' + avoided.map(a => a.name).join('、') + '。');
    } else {
      const ex = attractions.filter(a => a.closedDays && a.closedDays.length).slice(0, 2)
        .map(a => a.name + WEEKDAYS_CN[a.closedDays[0]] + '闭馆');
      warnings.push('未选出发日期，闭馆日未纳入计算'
        + (ex.length ? '（如：' + ex.join('、') + '）' : '') + '，建议填入日期后重新生成。');
    }

    const filledDays = days.filter(d => d.stops.length);
    if (filledDays.length < cfg.days) {
      warnings.push('当前城市包只有 ' + attractions.length + ' 个景点，仅能排出 '
        + filledDays.length + ' 天行程（其余 ' + (cfg.days - filledDays.length)
        + ' 天无内容）；餐饮/交通预算仍按 ' + cfg.days + ' 天计算。');
    }

    const perPerson = filledDays.reduce((acc, day) => [
      acc[0] + day.costPerPerson[0], acc[1] + day.costPerPerson[1]], [0, 0]);

    return { cfg, days: filledDays, warnings, skipped,
      costPerPerson: { tickets: perPerson },
      assumptions: [META_NOTE(startDate)] };
  }

  function META_NOTE(startDate) {
    return startDate ? ('行程按 ' + startDate + ' 起算，已规避已知固定闭馆日。')
      : '未指定出发日期，行程不含封馆日规避。';
  }

  /* ---------------- 预算与人数关系 ---------------- */
  function budgetSummary(plan, groupCfg, mealTier, transportMode) {
    const pk = pack();
    const heads = groupCfg.adults + groupCfg.children6 + groupCfg.children712 + groupCfg.seniors;
    const ticketable = groupCfg.adults + groupCfg.seniors + 0.5 * groupCfg.children712; // 幼童免票为通用近似
    const tickets = [Math.round(plan.costPerPerson.tickets[0] * ticketable),
                     Math.round(plan.costPerPerson.tickets[1] * ticketable)];
    const mt = mealTier;
    const meals = [mt.perDay[0] * heads * plan.cfg.days, mt.perDay[1] * heads * plan.cfg.days];

    const perCar = pk.taxiPerRide || [250, 450];
    const perRide = pk.transitPerRide || [30, 50];
    const carCap = pk.taxiPerCar || 4;
    let transport, transportNote = [];
    if (transportMode === 'mix') {
      const cars = Math.ceil(heads / carCap);
      transport = [perCar[0] * cars * plan.cfg.days + perRide[0] * heads * plan.cfg.days,
                   perCar[1] * cars * plan.cfg.days + perRide[1] * heads * plan.cfg.days];
      if (cars > 1) transportNote.push('共 ' + heads + ' 人，出租车需 ' + cars + ' 辆（每车限 ' + carCap + ' 人含副驾），打车费用×' + cars + '。');
      else transportNote.push(carCap + ' 人内一辆出租车即可；按每日约 1 整程打车+其余公交核算。');
    } else {
      // 全程公共交通：按每人每日约 3 程核算
      transport = [perRide[0] * 3 * heads * plan.cfg.days, perRide[1] * 3 * heads * plan.cfg.days];
      transportNote.push('公共交通按人头计费，人数增加线性增长。');
    }
    if (pk.transportNotes && pk.transportNotes[transportMode === 'mix' ? 'mix' : 'public']) {
      transportNote.push(pk.transportNotes[transportMode === 'mix' ? 'mix' : 'public']);
    }

    const bn = pk.budgetNotes || {};
    const notes = transportNote.slice();
    notes.push('餐饮按所选档位整日估算；行程内单餐标价为该店人均，仅供替换参考。');
    if (groupCfg.children6 > 0 && bn.childFree) notes.push(bn.childFree);
    if (groupCfg.children712 > 0 && bn.childHalf) notes.push(bn.childHalf);
    if (groupCfg.seniors > 0 && bn.senior) notes.push(bn.senior);
    if (heads >= 6 && bn.group6) notes.push(bn.group6);

    const total = [tickets[0] + meals[0] + transport[0], tickets[1] + meals[1] + transport[1]];
    return { heads, tickets, meals, transport, total, perPerson: [
      Math.round(total[0] / Math.max(heads, 1)), Math.round(total[1] / Math.max(heads, 1))], notes };
  }

  global.Planner = { generatePlan, budgetSummary, formatMin, transitFor, setPack,
    DAY_CAP_MIN, MAX_MOSQUES_PER_DAY, WEEKDAYS_CN };
  if (typeof module !== 'undefined' && module.exports) module.exports = global.Planner;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/validate.js ===== */
/* 城市包校验器：导入 JSON 时做结构/语义校验，给出可读错误清单。
 * 浏览器挂 window.ValidatePack，Node 走 module.exports。
 * 返回 { ok: bool, errors: string[] }
 */
(function (global) {
  'use strict';

  const GROUP_KEYS = ['solo', 'couple', 'family', 'elderly', 'friends'];
  const CATEGORY_KEYS = ['mosque', 'palace', 'museum', 'bazaar', 'waterfront',
    'viewpoint', 'neighborhood', 'experience']; // 引擎按这 8 类做排程语义

  function validatePack(p) {
    const errs = [];
    const E = m => { if (errs.length < 12) errs.push(m); };

    if (!p || typeof p !== 'object') return { ok: false, errors: ['城市包必须是一个 JSON 对象'] };
    if (!/^[a-z0-9-]{2,30}$/.test(p.id || '')) E('id：必填，小写字母/数字/连字符，2-30 位（如 "paris"）');
    if (!p.city || !p.country) E('city / country：必填（城市名与国家名，中文即可）');
    if (!p.currency || !p.currency.name) E('currency.name：必填（货币名，如 "里拉"）；perEur 可选（约多少货币=1欧元）');

    // 基础表
    const needArr = ['ATTRACTIONS', 'FOODS', 'TRANSPORT_GUIDE', 'ROUTE_TABLE', 'TIPS', 'QUICK_FACTS', 'HOWTO', 'TOP_PICKS'];
    needArr.forEach(k => { if (!Array.isArray(p[k]) || !p[k].length) E(k + '：必须是非空数组'); });
    ['DISTRICTS', 'CATEGORIES', 'GROUPS', 'PACE', 'INTERESTS', 'HOTELS', 'MEAL_TIERS'].forEach(k => {
      if (!p[k] || typeof p[k] !== 'object' || Array.isArray(p[k]) || !Object.keys(p[k]).length) E(k + '：必须是非空对象');
    });
    ['economy', 'comfort', 'premium'].forEach(k => {
      const t = p.MEAL_TIERS && p.MEAL_TIERS[k];
      if (!t || !Array.isArray(t.perDay) || t.perDay.length !== 2 || t.perDay.some(x => typeof x !== 'number' || x < 0))
        E('MEAL_TIERS.' + k + '.perDay：必须是 [min,max] 正数数组');
    });
    if (p.HOTELS && !('undecided' in p.HOTELS)) E('HOTELS：必须包含 "undecided" 选项');
    ['relaxed', 'standard', 'packed'].forEach(k => {
      const t = p.PACE && p.PACE[k];
      if (!t || typeof t.hours !== 'number') E('PACE.' + k + '.hours：必须为数字');
    });
    GROUP_KEYS.forEach(k => {
      if (!p.GROUPS || !p.GROUPS[k] || !p.GROUPS[k].label) E('GROUPS.' + k + '：缺少 label（五类人群一个不能少）');
    });

    // 分区
    const districts = p.DISTRICTS ? Object.keys(p.DISTRICTS) : [];
    if (districts.length) districts.forEach(d => {
      if (!p.DISTRICTS[d].name) E('DISTRICTS.' + d + '.name：缺少分区名');
    });

    // 景点
    const ids = new Set();
    if (Array.isArray(p.ATTRACTIONS)) p.ATTRACTIONS.forEach((a, i) => {
      const w = 'ATTRACTIONS[' + i + (a && a.id ? ' ' + a.id : '') + ']';
      if (!a || typeof a !== 'object') { E(w + '：格式错误'); return; }
      if (!a.id || !a.name) { E(w + '：缺少 id 或 name'); return; }
      if (ids.has(a.id)) E(w + '：id 重复 "' + a.id + '"');
      ids.add(a.id);
      if (!districts.includes(a.district)) E(w + '.district "' + a.district + '" 不在 DISTRICTS 中');
      if (!p.CATEGORIES || !(a.category in p.CATEGORIES)) E(w + '.category "' + a.category + '" 不在 CATEGORIES 中');
      if (!CATEGORY_KEYS.includes(a.category)) E(w + '.category 必须是引擎通用键之一：' + CATEGORY_KEYS.join('/') + '（显示名可在 CATEGORIES 自定义）');
      if (!(a.duration > 0 && a.duration <= 8)) E(w + '.duration：必须为 0-8 之间的小时数');
      if (!Array.isArray(a.price) || a.price.length !== 2 || a.price.some(x => typeof x !== 'number' || x < 0) || a.price[0] > a.price[1])
        E(w + '.price：必须是 [min,max] 且 min ≤ max');
      (a.closedDays || []).forEach(d => { if (![0,1,2,3,4,5,6].includes(d)) E(w + '.closedDays：' + d + ' 不在 0-6（0=周日）'); });
      GROUP_KEYS.forEach(g => {
        const v = a.groupFit && a.groupFit[g];
        if (!(v >= 1 && v <= 5)) E(w + '.groupFit.' + g + '：必须是 1-5');
      });
      if (!a.transport) E(w + '.transport：缺少"怎么去"说明');
      if (!Array.isArray(a.tips) || !a.tips.length) E(w + '.tips：至少 1 条贴士');
      if (!a.desc) E(w + '.desc：缺少简介');
    });
    if (Array.isArray(p.TOP_PICKS)) p.TOP_PICKS.forEach(id => {
      if (!ids.has(id)) E('TOP_PICKS："' + id + '" 不存在于 ATTRACTIONS');
    });

    // 换乘矩阵：所有分区对全覆盖（含双序任一）
    for (let i = 0; i < districts.length; i++) for (let j = i + 1; j < districts.length; j++) {
      const t = p.TRANSIT && (p.TRANSIT[districts[i] + '|' + districts[j]] || p.TRANSIT[districts[j] + '|' + districts[i]]);
      if (!t) E('TRANSIT：缺少分区对 ' + districts[i] + ' ↔ ' + districts[j]);
      else if (!(t.m > 0) || !t.how) E('TRANSIT ' + districts[i] + '|' + districts[j] + '：需要 m(分钟)>0 与 how(方式)');
    }

    // 美食
    if (Array.isArray(p.FOODS)) p.FOODS.forEach((f, i) => {
      const w = 'FOODS[' + i + ']';
      if (!f.name || !f.where) E(w + '：缺少 name 或 where');
      if (f.district !== 'any' && !districts.includes(f.district)) E(w + '.district "' + f.district + '" 不在 DISTRICTS 中（或用 "any"）');
      if (!Array.isArray(f.price) || f.price.length !== 2) E(w + '.price：必须是 [min,max]');
    });

    // 交通与贴士
    if (Array.isArray(p.ROUTE_TABLE)) p.ROUTE_TABLE.forEach((r, i) => {
      if (!Array.isArray(r) || r.length !== 4) E('ROUTE_TABLE[' + i + ']：每行必须是 4 列 [从→到, 怎么走, 耗时, 费用]');
    });
    if (Array.isArray(p.TIPS)) p.TIPS.forEach((t, i) => {
      if (!t.title || !Array.isArray(t.points) || !t.points.length) E('TIPS[' + i + ']：需要 title 与非空 points');
    });

    return { ok: errs.length === 0, errors: errs };
  }

  global.ValidatePack = validatePack;
  if (typeof module !== 'undefined' && module.exports) module.exports = validatePack;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== js/app.js ===== */
/* 通用旅行攻略工具 — 视图层（多城市包） */
(function () {
  'use strict';
  const P = window.Planner, validatePack = window.ValidatePack;
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const LS_PACKS = 'travelguide.customPacks';
  const LS_CITY = 'travelguide.lastCity';

  const Packs = window.CityPacks;
  let curId = 'istanbul';
  let D = Packs[curId];

  const state = { tab: 'overview', plan: null, budget: null, groupCfg: null,
    filters: { q: '', cat: '', district: '', group: '' } };

  /* ---------- 币种相关格式化 ---------- */
  const cur = () => D.currency || { name: '' };
  const tlRange = (v) => v[0] === v[1]
    ? (v[0] === 0 ? '免费' : '约 ' + v[0] + ' ' + cur().name)
    : '约 ' + v[0] + '–' + v[1] + ' ' + cur().name;
  const tlRangeEur = (v) => '≈ €' + (v[0] / cur().perEur).toFixed(0) + '–' + (v[1] / cur().perEur).toFixed(0);
  const fmtK = v => v[0] >= 10000
    ? `${Math.round(v[0] / 1000)}k–${Math.round(v[1] / 1000)}k ${cur().name}`
    : (v[0] >= 1000 ? `${Math.round(v[0] / 100) / 10}k–${Math.round(v[1] / 100) / 10}k ${cur().name}` : tlRange(v));

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function toast(html, isErr) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.innerHTML = html;
    el.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, isErr ? 8000 : 3500);
  }

  /* ---------- 城市切换 ---------- */
  function buildCitySelect() {
    const sel = $('#city-select');
    sel.innerHTML = Object.values(Packs).map(pk =>
      `<option value="${esc(pk.id)}">${esc(pk.country)} · ${esc(pk.city)}${pk.badge ? '（' + esc(pk.badge) + '）' : ''}</option>`).join('');
    sel.value = curId;
  }

  function switchCity(id, keepTab) {
    if (!Packs[id]) return;
    curId = id; D = Packs[id];
    const sel = $('#city-select'); if (sel) sel.value = id;
    P.setPack(D);
    try { localStorage.setItem(LS_CITY, id); } catch (e) {}
    // 标题与页头
    $('#city-name').textContent = D.country + '·' + D.city;
    document.title = D.city + '旅行攻略工具 · 游玩时长/人群适配/交通/行程';
    $('#site-sub').textContent = D.META.subtitle + ' ｜ 离线可用';
    $('#site-disclaimer').textContent = '⚠️ ' + D.META.disclaimer;
    // 重置状态
    state.filters = { q: '', cat: '', district: '', group: '' };
    state.plan = null; state.budget = null;
    renderAll();
    buildPlannerForm();
    if (!keepTab) switchTab('overview');
  }

  /* ---------- Tab 框架 ---------- */
  function switchTab(name) {
    state.tab = name;
    document.querySelectorAll('section.view').forEach(s =>
      s.classList.toggle('active', s.id === 'view-' + name));
    document.querySelectorAll('nav.tabs button').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === name));
    window.scrollTo({ top: 0 });
  }

  /* ---------- 总览 ---------- */
  function renderOverview() {
    $('#view-overview').innerHTML = `
      <h2 class="vt">📍 关于${esc(D.city)}</h2>
      <p class="vd">${esc(D.overview)}</p>
      <div class="warnbox">📍 ${esc(D.META.season)}</div>
      <div class="grid g3" id="qf-grid"></div>
      <h2 class="vt" style="margin-top:20px">🧭 怎么用这个工具</h2>
      <div class="grid g3" id="howto-grid"></div>
      <h2 class="vt" style="margin-top:20px">⭐ 最多人选的事</h2>
      <div class="chips" id="top-chips" style="margin-top:8px"></div>`;
    $('#qf-grid').innerHTML = D.QUICK_FACTS.map(f =>
      `<div class="card qf"><div class="icon">${f.icon}</div><div class="k">${esc(f.k)}</div><div class="v">${esc(f.v)}</div></div>`).join('');
    $('#howto-grid').innerHTML = D.HOWTO.map(h =>
      `<div class="card"><div style="font-size:20px">${h.icon}</div>${esc(h.text)}</div>`).join('');
    $('#top-chips').innerHTML = D.TOP_PICKS.map(id => {
      const a = D.ATTRACTIONS.find(x => x.id === id); if (!a) return '';
      return `<span class="chip" data-go="${a.id}">${esc(a.name)}</span>`;
    }).join('') + `<span class="chip on" id="go-plan">🧳 直接帮我排行程 →</span>`;
    $('#top-chips').querySelectorAll('[data-go]').forEach(el =>
      el.addEventListener('click', () => { switchTab('library');
        const a = D.ATTRACTIONS.find(x => x.id === el.dataset.go);
        resetLibraryFilters(a ? a.name : ''); }));
    const gp = $('#go-plan'); if (gp) gp.addEventListener('click', () => switchTab('planner'));
  }

  /* ---------- 景点库 ---------- */
  function fitStars(v) { return '★'.repeat(v) + '☆'.repeat(5 - v); }
  function renderLibrary() {
    const f = state.filters;
    let list = D.ATTRACTIONS.slice();
    if (f.q) {
      const q = f.q.trim().toLowerCase();
      list = list.filter(a => (a.name + a.local + a.tags.join('') + a.desc).toLowerCase().includes(q)
        || a.id === f.q);
    }
    if (f.cat) list = list.filter(a => a.category === f.cat);
    if (f.district) list = list.filter(a => a.district === f.district);
    if (f.group) list = list.filter(a => a.groupFit[f.group] >= 4)
      .sort((x, y) => y.groupFit[f.group] - x.groupFit[f.group]);
    else list.sort((x, y) => y.priority - x.priority || (x.id < y.id ? -1 : 1));

    $('#lib-count').textContent = '共 ' + list.length + ' 个';
    $('#lib-grid').innerHTML = list.map(a => {
      const closed = a.closedDays.length ? `<span class="badge warnclose">${a.closedDays.map(d => P.WEEKDAYS_CN[d]).join('/')}闭馆</span>` : '';
      const fit = f.group
        ? `<div class="fit-row"><b>${D.GROUPS[f.group].icon}${D.GROUPS[f.group].label}适配：</b>${fitStars(a.groupFit[f.group])}</div>`
        : `<div class="fit-row">${Object.keys(D.GROUPS).map(g =>
            `<span>${D.GROUPS[g].icon}<b>${fitStars(a.groupFit[g])}</b></span>`).join('')}</div>`;
      return `<div class="card attr-card" id="attr-${a.id}">
        <h3>${esc(a.name)} <span style="font-weight:400;color:var(--muted);font-size:12px">${esc(a.local || '')}</span></h3>
        <div class="meta">
          <span class="badge">${D.DISTRICTS[a.district].icon} ${esc(D.DISTRICTS[a.district].name)}</span>
          <span class="badge">${esc(D.CATEGORIES[a.category])}</span>
          <span class="badge time">⏱ 建议玩 ${a.duration < 1 ? a.duration * 60 + ' 分钟' : a.duration + ' 小时'}</span>
          <span class="badge price">💰 ${tlRange(a.price)}${cur().perEur && a.price[1] >= 800 ? '（' + tlRangeEur(a.price) + '）' : ''}</span>
          ${closed}
        </div>
        <p class="desc">${esc(a.desc)}</p>
        ${a.priceNote ? `<p class="desc" style="margin-top:3px">ℹ️ ${esc(a.priceNote)}</p>` : ''}
        ${fit}
        <div class="transport">🚏 ${esc(a.transport)}</div>
        <details><summary>看点与贴士</summary><ul>${a.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>
      </div>`;
    }).join('') || '<p class="vd">没有匹配的景点，试试放宽筛选条件。</p>';
  }

  function bindPlanner() {
    $('#p-days').addEventListener('input', e => $('#p-days-val').textContent = e.target.value + ' 天');
    $('#p-go').addEventListener('click', runPlan);
    $('#p-heads').addEventListener('input', e => {
      const others = ['children6', 'children712', 'seniors']
        .reduce((s, k) => s + (parseInt($('#p-' + k).value, 10) || 0), 0);
      const adults = Math.max(1, (parseInt(e.target.value, 10) || 1) - others);
      $('#p-adults').value = adults;
    });
  }

  function runPlan() {
   try {
    const cfg = {
      days: +$('#p-days').value,
      group: $('#p-group').value,
      pace: $('#p-pace').value,
      startDate: $('#p-date').value || null,
      interests: Array.from(document.querySelectorAll('#p-interests .chip.on')).map(c => c.dataset.interest),
      hotel: $('#p-hotel').value,
      mealTier: $('#p-meal').value,
    };
    state.plan = P.generatePlan(cfg, D.ATTRACTIONS);
    const g = {
      adults: Math.max(0, +$('#p-adults').value || 0),
      children6: Math.max(0, +$('#p-children6').value || 0),
      children712: Math.max(0, +$('#p-children712').value || 0),
      seniors: Math.max(0, +$('#p-seniors').value || 0),
    };
    const heads = g.adults + g.children6 + g.children712 + g.seniors;
    if (heads === 0) { g.adults = 1; }
    state.groupCfg = g;
    state.budget = P.budgetSummary(state.plan, g, D.MEAL_TIERS[$('#p-meal').value],
      $('#p-transport').value);
    renderPlan();
   } catch (e) {
    console.error(e);
    toast('❌ 行程生成失败：' + esc(e.message) + '<br>请检查城市包数据是否完整（可用「获取模板」对照）。', true);
   }
  }

  function renderPlan() {
    const plan = state.plan, b = state.budget;
    const grp = D.GROUPS[plan.cfg.group], pace = D.PACE[plan.cfg.pace];
    let html = `<div class="day-head no-print" style="margin-top:14px">
      <h3>🧳 ${esc(D.country)}·${esc(D.city)} ｜ ${grp.icon} ${esc(grp.label)} ｜ ${esc(pace.icon)} ${esc(pace.label)}节奏 ｜ ${plan.cfg.days} 天</h3>
      <span class="wd">${plan.cfg.startDate ? '自 ' + plan.cfg.startDate + ' 起' : '未选日期（未规避闭馆日）'}</span></div>`;

    html += plan.warnings.map(w => `<div class="warnbox">⚠️ ${esc(w)}</div>`).join('');

    html += plan.days.map(day => {
      const items = day.stops.map(s => {
        const a = s.attr;
        const tr = s.transit ? `<div class="tl-transit">🚏 从上一站：${esc(s.transit.how)} 约 ${s.transit.m} 分钟${s.transit.note ? '（' + esc(s.transit.note) + '）' : ''}</div>` : '';
        return { start: s.start, html: `<div class="tl-item">
          ${tr}
          <span class="tl-time">${P.formatMin(s.start)}–${P.formatMin(Math.round(s.end / 5) * 5)}</span>
          <span class="tl-name">${esc(a.name)}</span>
          <span class="tl-meta"> ｜ ⏱ ${a.duration} 小时 ｜ 💰 ${tlRange(a.price)} ｜ ${esc(D.DISTRICTS[a.district].name)}</span>
          <div class="tl-meta">${esc(a.transport)}</div>
        </div>` };
      });
      if (day.lunch && !day.lunch.inline) items.push({ start: day.lunch.start, html: `<div class="tl-item lunch">
        <span class="tl-time">${P.formatMin(day.lunch.start)}–${P.formatMin(day.lunch.end)}</span>
        <span class="tl-name">🍽 午餐：${esc(day.lunch.name)}</span>
        <span class="tl-meta"> ｜ ${esc(day.lunch.where)} ｜ ${tlRange(day.lunch.price)}/人</span></div>` });
      items.sort((x, y) => x.start - y.start);
      const stops = items.map(i => i.html).join('');
      const dinner = day.dinner ? `<div class="dinner">🌙 晚餐建议：<b>${esc(day.dinner.name)}</b>（${esc(day.dinner.where)}）
        ｜ ${tlRange(day.dinner.price)}/人</div>` : '';
      const notes = day.notes.map(n => `<div class="day-note">💡 ${esc(n)}</div>`).join('')
        + (day.lunch && day.lunch.inline ? `<div class="day-note">🍽 午餐在行程内解决：${esc(day.lunch.name)}（${esc(day.lunch.where)}，${tlRange(day.lunch.price)}/人）</div>` : '');
      return `<div class="card" style="margin-bottom:14px">
        <div class="day-head"><h3>Day ${day.index}</h3><span class="wd">${day.dateStr ? day.dateStr + ' ' : ''}${esc(day.weekday)}</span>
          <span class="tl-meta">当日门票参考 ${tlRange(day.costPerPerson)}/人</span></div>
        ${notes}
        <div class="tl">${stops}</div>
        ${dinner}
      </div>`;
    }).join('');

    // 预算
    const eurCards = cur().perEur
      ? `<div class="card"><div class="big">≈ €${Math.round(b.total[0] / cur().perEur / 10) * 10}–${Math.round(b.total[1] / cur().perEur / 10) * 10}</div><div class="lab">折合欧元（全团，汇率仅为参考）</div></div>` : '';
    html += `<div class="card" style="margin-top:8px">
      <h3>💰 预算估算（${b.heads} 人：${state.groupCfg.adults} 成人${state.groupCfg.children6 ? ' / ' + state.groupCfg.children6 + ' 幼童' : ''}${state.groupCfg.children712 ? ' / ' + state.groupCfg.children712 + ' 儿童' : ''}${state.groupCfg.seniors ? ' / ' + state.groupCfg.seniors + ' 老人' : ''}）</h3>
      <div class="budget">
        <div class="card"><div class="big">${fmtK(b.tickets)}</div><div class="lab">🎫 门票全团</div></div>
        <div class="card"><div class="big">${fmtK(b.meals)}</div><div class="lab">🍽 餐饮全团（${plan.cfg.days} 天）</div></div>
        <div class="card"><div class="big">${fmtK(b.transport)}</div><div class="lab">🚏 市内交通全团</div></div>
        ${eurCards}
        <div class="card"><div class="big">${fmtK(b.perPerson)}</div><div class="lab">🧍 人均（不含机票住宿）</div></div>
      </div>
      <div class="relbox"><b>👥 人数关系提示：</b><ul>${b.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>
    </div>`;

    // 未安排（含跳转景点库快捷入口）
    if (plan.skipped.length) {
      html += `<div class="card skipbox no-print" style="margin-top:12px"><h3>📋 未安排的景点（可手动替换）</h3>
        <ul>${plan.skipped.map(s => `<li><b>${esc(s.name)}</b> — ${esc(s.reason)}
          <a href="#" class="skip-link" data-name="${esc(s.name)}" style="color:var(--teal);font-size:12px">→ 在景点库查看</a></li>`).join('')}</ul></div>`;
    }
    html += `<div class="no-print" style="margin-top:14px">
      <button class="btn secondary" id="p-print2">🖨 打印 / 存 PDF 这份行程</button></div>`;
    $('#plan-out').innerHTML = html;
    document.querySelectorAll('.skip-link').forEach(a =>
      a.addEventListener('click', e => { e.preventDefault();
        switchTab('library'); resetLibraryFilters(a.dataset.name); }));
    const p2 = $('#p-print2'); if (p2) p2.addEventListener('click', () => window.print());
    $('#plan-out').scrollIntoView({ behavior: 'smooth' });
  }

  /* ---------- 城市包导入/导出/模板 ---------- */
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function stripForExport(pk) {
    const c = JSON.parse(JSON.stringify(pk));
    delete c._custom;
    const head = { id: c.id, country: c.country, city: c.city };
    if (c.badge) head.badge = c.badge;
    if (c.currency) head.currency = c.currency;
    Object.keys(head).forEach(k => delete c[k]);
    return Object.assign(head, c);
  }

  function persistCustomPacks() {
    try {
      const customs = Object.values(Packs).filter(p => p._custom).map(stripForExport);
      localStorage.setItem(LS_PACKS, JSON.stringify(customs));
    } catch (e) { /* file:// 下 localStorage 可能不可用：仅本会话有效 */ }
  }

  function loadCustomPacks() {
    try {
      const raw = localStorage.getItem(LS_PACKS);
      if (!raw) return;
      JSON.parse(raw).forEach(pk => {
        const v = validatePack(pk);
        if (v.ok) { pk._custom = true; Packs[pk.id] = pk; }
      });
    } catch (e) { /* 忽略 */ }
  }

  function importPackFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let pk;
      try { pk = JSON.parse(reader.result); }
      catch (e) { toast('❌ 不是有效的 JSON 文件：' + esc(e.message), true); return; }
      const v = validatePack(pk);
      if (!v.ok) {
        toast('❌ 城市包校验未通过（' + v.errors.length + ' 处）：<br>· ' + v.errors.join('<br>· '), true);
        return;
      }
      pk._custom = true;
      const existed = !!Packs[pk.id];
      Packs[pk.id] = pk;
      persistCustomPacks();
      buildCitySelect();
      switchCity(pk.id, true);
      toast((existed ? '🔄 已更新' : '✅ 已导入') + ' 城市包：<b>' + esc(pk.country) + '·' + esc(pk.city) + '</b>（' + pk.ATTRACTIONS.length + ' 个景点）。'
        + (existed ? '' : '自定义包保存在本浏览器，双击离线打开时同样可用。'));
    };
    reader.onerror = () => toast('❌ 文件读取失败', true);
    reader.readAsText(file, 'utf-8');
  }

  /* ---------- 渲染编排 ---------- */
  function renderAll() {
    renderOverview();
    rebuildLibraryFilters();
    renderTransport();
    renderTips();
  }

  /* ---------- 启动 ---------- */
  document.addEventListener('DOMContentLoaded', () => {
    loadCustomPacks();
    let last = null;
    try { last = localStorage.getItem(LS_CITY); } catch (e) {}
    if (last && Packs[last]) curId = last;

    document.querySelectorAll('nav.tabs button').forEach(b =>
      b.addEventListener('click', () => switchTab(b.dataset.tab)));
    $('#city-select').addEventListener('change', e => switchCity(e.target.value, true));
    $('#btn-export').addEventListener('click', exportCurrentPack);
    $('#btn-template').addEventListener('click', downloadTemplate);
    $('#btn-import').addEventListener('click', () => $('#file-import').click());
    $('#file-import').addEventListener('change', e => {
      if (e.target.files && e.target.files[0]) importPackFile(e.target.files[0]);
      e.target.value = '';
    });

    buildCitySelect();
    bindLibrary();
    bindPlanner();
    switchCity(curId, true); // 初始化 + 渲染
    switchTab('overview');
  });
})();

</script>
</body>
</html>
